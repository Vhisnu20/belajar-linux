name: Secret Demo

on:
  pull_request:

jobs:
  secret-demo:
    runs-on: ubuntu-24.04
    steps:
      - name: Try to print the secret directly
        run: echo "Token is ${{ secrets.LAB_API_TOKEN }}"

      - name: Use the secret through an env variable
        env:
          API_TOKEN: ${{ secrets.LAB_API_TOKEN }}
        run: |
          echo "Token length: ${#API_TOKEN}"
          if [ -z "$API_TOKEN" ]; then
            echo "ERROR: API_TOKEN is empty"
            exit 1
          fi
          echo "Token is set"
