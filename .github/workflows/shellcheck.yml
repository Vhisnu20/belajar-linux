name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show ShellCheck version
        run: shellcheck --version

      - name: Run ShellCheck
        run: shellcheck *.sh
